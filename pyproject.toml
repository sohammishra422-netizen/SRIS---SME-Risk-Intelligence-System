[project]
name = "sris-models"
version = "0.1.0"
description = "Model layer for the SME Resilience Intelligence System"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
